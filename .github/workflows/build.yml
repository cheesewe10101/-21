name: x11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files (debug)
      shell: pwsh
      run: |
        Get-ChildItem
        Write-Host "=== Checking files ==="
        Test-Path "larp.py"
        Test-Path "рыбка.jpeg"
        Test-Path "nya.ico"
        Test-Path "ljnn.mp3"
        Test-Path "trava.mp3"
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
    
    - name: Build executable
      shell: pwsh
      run: |
        $currentDir = (Get-Location).Path
        Write-Host "Building from: $currentDir"
        
        pyinstaller --onefile --windowed `
          --name "openbsdverycoolsystem" `
          --add-data "$currentDir\рыбка.jpeg;." `
          --add-data "$currentDir\nya.ico;." `
          --add-data "$currentDir\ljnn.mp3;." `
          --add-data "$currentDir\trava.mp3;." `
          "$currentDir\larp.py"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openbsdverycoolsystem
        path: dist/*.exe
        retention-days: 14
